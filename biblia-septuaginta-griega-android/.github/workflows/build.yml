name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma de Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar la integridad de la base de datos
        run: |
          test -f app/src/main/assets/biblia.db
          echo "Base de datos: $(du -h app/src/main/assets/biblia.db | cut -f1)"
          python3 tools/verify_db.py

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: biblia-griega-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
