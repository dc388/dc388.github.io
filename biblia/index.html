<meta name="description" content="Antiguo Testamento hebreo, Septuaginta, Nuevo Testamento griego, Padres Apostólicos y el Libro de Enoc, en sus lenguas originales.">

<style>
:root{
  --papel:#f5efe2; --papel-alto:#ede4d4; --tinta:#2b2620; --tinta-suave:#6b6255;
  --borde:#ddd2bd; --realce:#7a5c2e; --sombra:0 1px 2px rgba(0,0,0,.06);
  --cuerpo:1.125rem; --interlineado:1.75;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --papel:#121319; --papel-alto:#1d1e26; --tinta:#e8e3d8; --tinta-suave:#9a9488;
    --borde:#2e2f38; --realce:#d8b26a; --sombra:none;
  }
}
:root[data-tema="oscuro"]{
  --papel:#121319; --papel-alto:#1d1e26; --tinta:#e8e3d8; --tinta-suave:#9a9488;
  --borde:#2e2f38; --realce:#d8b26a; --sombra:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--papel); color:var(--tinta);
  font-family:"Noto Serif",Georgia,"Times New Roman",serif;
  line-height:1.5;
}
header{
  position:sticky; top:0; z-index:5; background:var(--papel);
  border-bottom:1px solid var(--borde);
  padding:env(safe-area-inset-top) 16px 0;
}
.barra{display:flex; align-items:center; gap:12px; min-height:56px; max-width:44rem; margin:0 auto}
.barra h1{font-size:1.0625rem; font-weight:600; margin:0; flex:1; letter-spacing:.01em}
button{
  font:inherit; color:inherit; background:none; border:1px solid var(--borde);
  border-radius:999px; padding:6px 12px; cursor:pointer; box-shadow:var(--sombra);
}
button:hover{border-color:var(--realce)}
button.plano{border:none; box-shadow:none; padding:6px 8px; line-height:0}
main{max-width:44rem; margin:0 auto; padding:20px 16px 96px}
h2{font-size:1rem; font-weight:600; color:var(--tinta-suave); text-transform:uppercase;
   letter-spacing:.06em; margin:28px 0 10px}
h2:first-child{margin-top:4px}
.rejilla{display:flex; flex-wrap:wrap; gap:8px}
.rejilla a{
  display:block; text-decoration:none; color:inherit; background:var(--papel-alto);
  border:1px solid var(--borde); border-radius:10px; padding:9px 13px; box-shadow:var(--sombra);
}
.rejilla a:hover{border-color:var(--realce)}
.rejilla.capitulos a{min-width:3rem; text-align:center; font-variant-numeric:tabular-nums}
.fuente{color:var(--tinta-suave); font-size:.8125rem; margin:6px 0 0; line-height:1.5}
.nota{
  background:var(--papel-alto); border:1px solid var(--borde); border-left:3px solid var(--realce);
  border-radius:8px; padding:10px 13px; color:var(--tinta-suave); font-size:.875rem; margin:0 0 18px;
}
.versiculo{margin:0 0 .9em; font-size:var(--cuerpo); line-height:var(--interlineado)}
.versiculo .n{
  color:var(--realce); font-size:.75em; font-weight:600; vertical-align:.35em;
  margin-inline-end:.4em; font-variant-numeric:tabular-nums;
}
.versiculo .es{display:block; font-size:.8125em; color:var(--tinta-suave); margin-top:.25em; line-height:1.5}
/* La Reina-Valera es española aunque el versículo de arriba sea hebreo: sin
   esto hereda la dirección del capítulo y la puntuación salta al otro lado. */
[dir="rtl"] .versiculo .es{direction:ltr; text-align:left}
[dir="rtl"] .versiculo{font-family:"Noto Serif Hebrew","Noto Serif",serif}
.corrido .versiculo{display:inline; margin:0}
.corrido .versiculo .es{display:none}
.pie{display:flex; gap:10px; justify-content:space-between; margin-top:32px}
.anuncio{margin:28px auto 0; min-height:90px; text-align:center}
.cargando{color:var(--tinta-suave); padding:24px 0}
a.volver{text-decoration:none; color:var(--realce); font-size:.9375rem}
.pal{
  font:inherit; color:inherit; background:none; border:none; box-shadow:none;
  padding:0 .05em; margin:0; cursor:pointer; border-radius:3px;
  border-bottom:1px dotted var(--borde);
}
.pal:hover,.pal:focus{background:var(--papel-alto); border-bottom-color:var(--realce); outline:none}
.hoja{
  position:fixed; inset:auto 0 0 0; z-index:20; max-height:78vh; overflow:auto;
  background:var(--papel-alto); border-top:1px solid var(--borde);
  border-radius:16px 16px 0 0; box-shadow:0 -4px 24px rgba(0,0,0,.18);
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
.hoja[hidden]{display:none}
.hoja .cerrar{position:absolute; top:12px; inset-inline-end:12px}
.hoja .cuerpo{max-width:44rem; margin:0 auto}
.hoja h3{margin:0 0 2px; font-size:1.5rem; font-weight:600}
.hoja .lema{color:var(--tinta-suave); margin:0 0 14px; font-size:.9375rem}
.hoja dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 14px; font-size:.9375rem}
.hoja dt{color:var(--tinta-suave)}
.hoja dd{margin:0}
.hoja .apartado{border-top:1px solid var(--borde); padding-top:12px; margin-top:12px}
.hoja .apartado h4{margin:0 0 6px; font-size:.75rem; text-transform:uppercase;
  letter-spacing:.06em; color:var(--tinta-suave); font-weight:600}
.hoja .apartado p{margin:0; font-size:.9375rem; line-height:1.6}
/* El artículo del léxico viene con sus acepciones numeradas en líneas: se
   respetan, que es la mitad de lo que hace legible una entrada de léxico. */
.hoja .apartado > summary{margin:0 0 6px; font-size:.75rem; text-transform:uppercase;
  letter-spacing:.06em; color:var(--tinta-suave); font-weight:600; cursor:pointer;
  list-style:none; display:flex; align-items:center; gap:6px}
.hoja .apartado > summary::-webkit-details-marker{display:none}
.hoja .apartado > summary::before{content:"\203A"; transition:transform .15s; font-size:1.3em}
.hoja .apartado[open] > summary::before{transform:rotate(90deg)}
.hoja p.articulo{white-space:pre-wrap}
.hoja details.ingles summary{
  cursor:pointer; color:var(--tinta-suave); font-size:.8125rem; list-style:none;
  display:flex; align-items:center; gap:6px;
}
.hoja details.ingles summary::-webkit-details-marker{display:none}
.hoja details.ingles summary::before{content:"›"; transition:transform .15s; font-size:1.1em}
.hoja details.ingles[open] summary::before{transform:rotate(90deg)}
.hoja details.ingles summary:hover{color:var(--realce)}
.hoja details.ingles h4{margin-top:14px}
.hoja .aviso{font-size:.8125rem; color:var(--tinta-suave); line-height:1.5}
footer{
  max-width:44rem; margin:0 auto; padding:24px 16px calc(32px + env(safe-area-inset-bottom));
  border-top:1px solid var(--borde); color:var(--tinta-suave); font-size:.8125rem; line-height:1.6;
}
footer p{margin:0 0 6px}
footer a{color:var(--realce)}
</style>
</head>
<body>
<header>
  <div class="barra">
    <a class="volver" href="#/" id="atras" hidden>‹ Atrás</a>
    <h1 id="titulo">Biblia Griega y Hebrea</h1>
    <button class="plano" id="menos" title="Letra más pequeña" hidden>A−</button>
    <button class="plano" id="mas" title="Letra más grande" hidden>A+</button>
    <button class="plano" id="tema" title="Tema claro u oscuro" aria-label="Cambiar entre tema claro y oscuro"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2a8 8 0 010 16z" fill="currentColor"/></svg></button>
  </div>
</header>

<main id="vista"><p class="cargando">Cargando la biblioteca…</p></main>

<div class="hoja" id="hoja" hidden role="dialog" aria-modal="true" aria-label="Análisis de la palabra">
  <button class="cerrar" id="cerrarHoja" aria-label="Cerrar">✕</button>
  <div class="cuerpo" id="cuerpoHoja"></div>
</div>

<footer>
  <p>
    Textos en dominio público o con licencia libre; cada colección dice su
    edición y su licencia en la biblioteca.
  </p>
  <p>
    <a href="../biblia-privacidad.html">Política de privacidad</a> ·
    <a href="https://play.google.com/store/apps/details?id=com.dc388.bibliagriega">La aplicación para Android</a>
  </p>
</footer>

<script>
const vista = document.getElementById('vista');
const titulo = document.getElementById('titulo');
const atras = document.getElementById('atras');
let indice = null;

// --- preferencias -----------------------------------------------------------
// Van en localStorage, que es del navegador de cada quien: si no está
// disponible —navegación privada, cookies bloqueadas— la página funciona igual,
// simplemente no recuerda nada.
const guarda = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lee = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };

let cuerpo = parseFloat(lee('cuerpo', '1.125'));
const aplicaCuerpo = () => document.documentElement.style.setProperty('--cuerpo', cuerpo + 'rem');
aplicaCuerpo();

const tema = lee('tema', '');
if (tema) document.documentElement.dataset.tema = tema;
document.getElementById('tema').onclick = () => {
  const actual = document.documentElement.dataset.tema;
  const siguiente = actual === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.dataset.tema = siguiente;
  guarda('tema', siguiente);
};
document.getElementById('mas').onclick = () => { cuerpo = Math.min(1.75, cuerpo + .0625); aplicaCuerpo(); guarda('cuerpo', cuerpo); };
document.getElementById('menos').onclick = () => { cuerpo = Math.max(.875, cuerpo - .0625); aplicaCuerpo(); guarda('cuerpo', cuerpo); };

// --- datos ------------------------------------------------------------------
// El sello de la exportación. Los archivos de datos se guardan en la caché del
// navegador, que es lo que se quiere porque no cambian entre versiones; pero
// entonces una corrección nueva no llega nunca. Se lee este sello sin caché
// —pesa unas decenas de bytes— y se cuelga de todas las demás direcciones, así
// que al reexportar cambian todas y se vuelven a pedir.
let sello = '';
async function leerElSello() {
  try {
    const r = await fetch('datos/version.json', { cache: 'no-store' });
    if (r.ok) sello = (await r.json()).sello || '';
  } catch (e) { /* sin sello se sigue igual, solo que con la caché de siempre */ }
}

const trae = async (url) => {
  const r = await fetch(sello ? `${url}?v=${sello}` : url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
};
const escapa = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Los códigos de libro se repiten entre colecciones —«GEN» es Génesis en
// hebreo y en la Septuaginta, y son textos distintos—, así que la colección
// forma parte de la dirección y no se puede buscar solo por el código.
// Misma normalización que usa la base al construir el índice: minúsculas sin
// diacríticos, sigma final unificada y sin puntuación. Sin esto, «Λόγος,» no
// encuentra a «λογος» en el puente de formas.
function normaliza(s) {
  return s.normalize('NFD').toLowerCase()
    .replace(/[\u0300-\u036f\u0591-\u05c7]/g, '')
    .replace(/ς/g, 'σ')
    .replace(/[^\p{L}\p{N}]/gu, '')
    .trim();
}

const cache = new Map();
async function traeCache(url) {
  if (!cache.has(url)) {
    cache.set(url, trae(url).catch(() => null));
  }
  return cache.get(url);
}

// El léxico va en cubos por millar de número Strong: G746 está en G0, G3056 en
// G3. Así una consulta baja unos cientos de kilobytes en vez del diccionario
// entero, y el segundo toque de la misma zona ya no baja nada.
const traeLexico = (strong) =>
  traeCache(`datos/lexico/${strong[0]}${Math.floor(parseInt(strong.slice(1), 10) / 1000)}.json`);
const traeFormas = (forma) => traeCache(`datos/formas/${forma.codePointAt(0)}.json`);
const traeMorfologia = () => traeCache('datos/morfologia.json');

function buscaLibro(coleccion, codigo) {
  const col = indice.find((c) => c.id === coleccion);
  if (!col) return null;
  const libro = col.libros.find((l) => l.codigo === codigo);
  return libro ? { col, libro } : null;
}

// --- pantallas --------------------------------------------------------------
function biblioteca() {
  titulo.textContent = 'Biblia Griega y Hebrea';
  atras.hidden = true;
  document.getElementById('mas').hidden = true;
  document.getElementById('menos').hidden = true;
  vista.innerHTML = indice.map((col) => `
    <section>
      <h2>${escapa(col.nombre)}</h2>
      <div class="rejilla">
        ${col.libros.map((l) => `<a href="#/${col.id}/${l.codigo}">${escapa(l.nombre)}</a>`).join('')}
      </div>
      <p class="fuente">${escapa(col.edicion)} · ${escapa(col.licencia)}</p>
    </section>`).join('');
}

function capitulos(coleccion, codigo) {
  const hallado = buscaLibro(coleccion, codigo);
  if (!hallado) return biblioteca();
  const { libro } = hallado;
  titulo.textContent = libro.nombre;
  atras.hidden = false;
  atras.href = '#/';
  vista.innerHTML = `
    <h2>${escapa(libro.original)}</h2>
    ${libro.nota ? `<p class="nota">${escapa(libro.nota)}</p>` : ''}
    <div class="rejilla capitulos">
      ${libro.capitulos.map((c) => `<a href="#/${coleccion}/${codigo}/${c}">${c}</a>`).join('')}
    </div>`;
}

async function lector(coleccion, codigo, capitulo) {
  const hallado = buscaLibro(coleccion, codigo);
  if (!hallado) return biblioteca();
  const { col, libro } = hallado;
  titulo.textContent = `${libro.nombre} ${capitulo}`;
  atras.hidden = false;
  atras.href = `#/${coleccion}/${codigo}`;
  document.getElementById('mas').hidden = false;
  document.getElementById('menos').hidden = false;
  vista.innerHTML = '<p class="cargando">Cargando…</p>';

  let versiculos;
  try {
    versiculos = await trae(`datos/${coleccion}/${codigo}/${capitulo}.json`);
  } catch (e) {
    vista.innerHTML = '<p class="cargando">No se pudo cargar este capítulo. Comprueba la conexión.</p>';
    return;
  }

  // El análisis va en su propio archivo y no existe en todas las colecciones:
  // la Septuaginta, los Padres y los pseudoepígrafos no vienen etiquetados. Si
  // no está, sus palabras se consultan igual por su forma en el Nuevo
  // Testamento, que es lo que hace la aplicación de Android.
  const palabras = await traeCache(`datos/${coleccion}/${codigo}/${capitulo}.palabras.json`);
  const griego = col.lengua === 'grc';

  const i = libro.capitulos.indexOf(capitulo);
  const anterior = i > 0 ? libro.capitulos[i - 1] : null;
  const siguiente = i >= 0 && i < libro.capitulos.length - 1 ? libro.capitulos[i + 1] : null;

  vista.innerHTML = `
    <div ${col.rtl ? 'dir="rtl"' : ''}>
      ${versiculos.map((v) => `
        <p class="versiculo">
          <span class="n">${v.v}${v.s || ''}</span>${cuerpoDelVersiculo(v, palabras, griego)}
          ${v.es ? `<span class="es" dir="ltr" lang="es">${escapa(v.es)}</span>` : ''}
        </p>`).join('')}
    </div>
    <nav class="pie">
      ${anterior ? `<a class="volver" href="#/${coleccion}/${codigo}/${anterior}">‹ ${anterior}</a>` : '<span></span>'}
      ${siguiente ? `<a class="volver" href="#/${coleccion}/${codigo}/${siguiente}">${siguiente} ›</a>` : '<span></span>'}
    </nav>`;
  window.scrollTo(0, 0);
}

/**
 * El texto del versículo, con sus palabras tocables cuando se pueden consultar.
 *
 * Con análisis se usan sus palabras, que traen lema y morfología propios. Sin
 * él, y si el texto es griego, se parte por espacios y cada trozo se consulta
 * por su forma. En hebreo sin análisis no se ofrece nada: buscar una forma
 * hebrea en un índice griego no daría más que ruido.
 */
function cuerpoDelVersiculo(v, palabras, griego) {
  const analisis = palabras && palabras[`${v.v}${v.s || ''}`];
  if (analisis) {
    return analisis.map((p) =>
      `<button class="pal" data-strong="${p[1]}" data-hom="${p[2] || ''}" data-morph="${escapa(p[3] || '')}">${escapa(p[0])}</button>`
    ).join(' ');
  }
  if (!griego) return escapa(v.t);
  return v.t.split(/\s+/).filter(Boolean).map((palabra) =>
    `<button class="pal" data-forma="${escapa(palabra)}">${escapa(palabra)}</button>`
  ).join(' ');
}

// --- ficha de la palabra ----------------------------------------------------
const hoja = document.getElementById('hoja');
const cuerpoHoja = document.getElementById('cuerpoHoja');
const cierraHoja = () => { hoja.hidden = true; };
document.getElementById('cerrarHoja').onclick = cierraHoja;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cierraHoja(); });

vista.addEventListener('click', (e) => {
  const boton = e.target.closest('.pal');
  if (boton) abreLaPalabra(boton);
});

/**
 * La definición de Strong, en español cuando ya está traducida.
 *
 * Strong escribió en inglés en 1890 y su obra es la que hay en dominio
 * público. Se va traduciendo a mano por orden de frecuencia, así que mientras
 * a un lema no le haya tocado se enseña la inglesa, dicho claramente: es
 * preferible a un hueco vacío, y a quien no lee inglés le avisa de por qué no
 * lo entiende.
 */
function definicion(e) {
  if (e.definicion_es) {
    return `<div class="apartado"><h4>Diccionario Strong</h4><p>${escapa(e.definicion_es)}</p></div>`;
  }
  return '';
}

/**
 * El artículo del léxico de referencia, cuando ya se lee en español.
 *
 * Brown-Driver-Briggs y Abbott-Smith son las dos obras de referencia serias en
 * dominio público, y son inglesas. Se traducen con reglas: lo que no está en
 * ningún idioma —el lema hebreo o griego, las referencias bíblicas, los códigos
 * de conjugación— pasa intacto, y las abreviaturas se abren, que es lo que
 * dejaba fuera a quien no se crió leyendo léxicos ingleses. Si un artículo no
 * sale entero, no sale: se queda abajo, en inglés, y se dice.
 */
function articuloEnEspanol(articulo) {
  if (!articulo || !articulo.texto_es) return '';
  return `<details class="apartado" open>
    <summary>${escapa(articulo.fuente)}</summary>
    <p class="articulo">${escapa(articulo.texto_es)}</p>
  </details>`;
}

/**
 * Lo que sigue en inglés, plegado.
 *
 * Mientras a un lema no le haya llegado el turno se enseña el original, dicho
 * claramente: es preferible a un hueco vacío, y a quien no lee inglés le avisa
 * de por qué no lo entiende, en vez de dejarlo pensando que falla la
 * aplicación. Lo que ya está traducido no se repite aquí.
 */
function enIngles(e, articulo) {
  const partes = [];
  if (!e.definicion_es && e.definicion) {
    partes.push(`<h4>Diccionario Strong (1890)</h4><p>${escapa(e.definicion)}</p>`);
  }
  if (articulo && !articulo.texto_es) {
    partes.push(`<h4>${escapa(articulo.fuente)}</h4><p>${escapa(articulo.texto)}</p>`);
  }
  if (!partes.length) return '';
  return `<details class="apartado ingles">
    <summary>Obras de referencia, en inglés</summary>
    ${partes.join('')}
  </details>`;
}

async function abreLaPalabra(boton) {
  const superficie = boton.textContent;
  cuerpoHoja.innerHTML = `<h3>${escapa(superficie)}</h3><p class="lema">Consultando…</p>`;
  hoja.hidden = false;

  let strong = boton.dataset.strong;
  let hom = boton.dataset.hom || '';
  let morph = boton.dataset.morph || '';
  let prestada = false;

  if (!strong) {
    // Palabra sin análisis propio: se busca su forma en el Nuevo Testamento.
    const forma = normaliza(boton.dataset.forma || superficie);
    const cubo = forma ? await traeFormas(forma) : null;
    const lecturas = cubo && cubo[forma];
    if (!lecturas || !lecturas.length) {
      cuerpoHoja.innerHTML = `<h3>${escapa(superficie)}</h3>
        <p class="aviso">Esta forma no aparece en el Nuevo Testamento, que es de
        donde se toma el análisis para los textos que no vienen etiquetados.</p>`;
      return;
    }
    [strong, morph] = lecturas[0];
    prestada = true;
  }

  const [cubo, morfologia] = await Promise.all([traeLexico(strong), traeMorfologia()]);
  const e = (cubo && cubo[strong]) || {};
  const glosa = (e.es || {})[hom] ?? (e.es || {})[''] ?? null;
  const articulo = (e.articulos || {})[hom] ?? (e.articulos || {})[''] ?? null;
  const analisis = morph ? (morfologia && morfologia[morph]) || morph : null;

  cuerpoHoja.innerHTML = `
    <h3>${escapa(superficie)}</h3>
    <p class="lema">${escapa(e.lema || '')}${e.translit ? ` · ${escapa(e.translit)}` : ''}${glosa ? ` · ${escapa(glosa)}` : ''}</p>
    <dl>
      ${analisis ? `<dt>Análisis</dt><dd>${escapa(analisis)}</dd>` : ''}
      <dt>Strong</dt><dd>${escapa(strong)}</dd>
      ${e.origen ? `<dt>Procede de</dt><dd>${escapa(e.origen)}</dd>` : ''}
    </dl>
    ${definicion(e)}
    ${articuloEnEspanol(articulo)}
    ${enIngles(e, articulo)}
    ${prestada ? `<p class="aviso apartado">Este texto no viene analizado. Lo que ves es
      lo que esa misma forma significa en el Nuevo Testamento, donde sí está etiquetada.</p>` : ''}`;
}

// --- navegación -------------------------------------------------------------
function ruta() {
  if (!indice) return;
  const partes = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (partes.length < 2) return biblioteca();
  if (partes.length === 2) return capitulos(partes[0], partes[1]);
  return lector(partes[0], partes[1], parseInt(partes[2], 10));
}

window.addEventListener('hashchange', ruta);

leerElSello()
  .then(() => trae('datos/indice.json'))
  .then((d) => { indice = d; ruta(); })
  .catch(() => {
    vista.innerHTML = '<p class="cargando">No se pudo cargar la biblioteca.</p>';
  });
</script>
