name: Capturas — Biblia

# Toma las capturas de pantalla que pide Google Play, de la aplicación de verdad
# corriendo en un emulador.
#
# No son maquetas: es el mismo APK que se instala, con la base de datos
# completa, fotografiado mientras el test lo recorre. Play exige que las
# capturas representen lo que el usuario se va a encontrar, y esta es la única
# forma de garantizarlo sin tener el teléfono delante.
#
# El emulador es de 1080×1920 a propósito: Play solo acepta 16:9 o 9:16, y los
# teléfonos modernos son más alargados que eso.

on:
  workflow_dispatch:
  # GitHub solo ofrece el botón «Run workflow» en la rama por defecto, así que
  # mientras esto viva en una rama de trabajo se dispara al tocar el test o el
  # propio flujo. Es un trabajo de media hora: no conviene lanzarlo con cada
  # cambio del proyecto.
  push:
    branches: ["claude/biblia-**"]
    paths:
      - "biblia-septuaginta-griega-android/app/src/androidTest/**/CapturasTest.kt"
      - ".github/workflows/biblia-capturas.yml"

permissions:
  contents: read

jobs:
  capturas:
    name: Capturas en el emulador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: biblia-septuaginta-griega-android

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma de Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruir la base de datos
        run: python3 tools/build_db.py

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: Tomar las capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Nexus 5: 1080×1920, que es 9:16 exacto. Un Pixel moderno da 1080×2400
          # y Play lo rechaza por proporción.
          profile: Nexus 5
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: biblia-septuaginta-griega-android
          script: |
            ./gradlew connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.dc388.bibliagriega.CapturasTest \
              --stacktrace
            mkdir -p capturas
            adb pull /sdcard/Android/data/com.dc388.bibliagriega.debug/files/capturas/. capturas/
            ls -la capturas/

      - name: Comprobar que sirven para Play
        run: |
          python3 - <<'PY'
          import pathlib, struct, sys
          fotos = sorted(pathlib.Path("capturas").glob("*.png"))
          if len(fotos) < 2:
              sys.exit(f"Play pide 2 capturas como mínimo y hay {len(fotos)}")
          malas = []
          for f in fotos:
              d = f.read_bytes()
              w, h = struct.unpack(">II", d[16:24])
              razon = round(w / h, 4)
              ok = (abs(razon - 9/16) < 0.01 or abs(razon - 16/9) < 0.01)
              ok = ok and 320 <= w <= 3840 and 320 <= h <= 3840 and len(d) <= 8*1024*1024
              print(f"{f.name}: {w}×{h}  {len(d)/1024:.0f} KB  {'ok' if ok else 'NO VALE'}")
              if not ok:
                  malas.append(f.name)
          if malas:
              sys.exit("Play rechazaría: " + ", ".join(malas))
          print(f"\n{len(fotos)} capturas listas para subir a Play.")
          PY

      - name: Publicar las capturas
        uses: actions/upload-artifact@v4
        with:
          name: biblia-capturas
          path: biblia-septuaginta-griega-android/capturas/*.png
          if-no-files-found: error
          retention-days: 30
