name: Publicación — Biblia

# Compila el AAB que se sube a Google Play y un APK del mismo código para
# probarlo antes.
#
# Funciona con y sin clave de firma:
#
#   - Sin los secretos configurados compila igual, sin firmar. Sirve para
#     comprobar que la compilación de publicación pasa —que es donde aparecen
#     los fallos de R8, que no salen en la de depuración— antes de tener la
#     clave. Un AAB sin firmar NO se puede subir a Play.
#   - Con los cuatro secretos puestos (ver docs/PUBLICAR_EN_PLAY.md) compila
#     firmado y el AAB ya se puede subir.
#
# Este workflow vive en la raíz porque GitHub solo ejecuta los de .github/
# workflows del repositorio; el del proyecto hace lo mismo cuando la app tenga
# repositorio propio.

on:
  workflow_dispatch:
  push:
    tags: ["biblia-v*"]
    # GitHub solo ofrece el botón «Run workflow» para los workflows que están en
    # la rama por defecto, así que mientras esto viva en una rama de trabajo se
    # dispara también al empujar cambios del proyecto.
    branches: ["claude/biblia-**"]
    paths:
      - "biblia-septuaginta-griega-android/**"
      - ".github/workflows/biblia-release.yml"


permissions:
  contents: read

jobs:
  release:
    name: AAB y APK de publicación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biblia-septuaginta-griega-android

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma de Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruir la base de datos
        run: python3 tools/build_db.py

      - name: Comprobar la integridad de la base de datos
        run: python3 tools/verify_db.py

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar el almacén de claves
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin KEYSTORE_BASE64: se compilará sin firmar, solo para comprobar que la compilación pasa. Ver docs/PUBLICAR_EN_PLAY.md"
            echo "firmado=no" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "firmado=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar AAB y APK
        env:
          KEYSTORE_FILE: ${{ steps.firma.outputs.firmado == 'si' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Borrar el almacén de claves
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Resumen
        run: |
          {
            echo "## Compilación de publicación"
            echo
            if [ "${{ steps.firma.outputs.firmado }}" = "si" ]; then
              echo "Firmada: el AAB se puede subir a Google Play."
            else
              echo "**Sin firmar.** Comprueba que la compilación pasa, pero Play no lo acepta."
              echo "Para firmarla, configura los secretos que explica \`docs/PUBLICAR_EN_PLAY.md\`."
            fi
            echo
            echo "| Archivo | Tamaño |"
            echo "|---|---|"
            find app/build/outputs -name '*.aab' -o -name '*.apk' | sort | while read -r f; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: biblia-publicacion
          path: |
            biblia-septuaginta-griega-android/app/build/outputs/bundle/release/*.aab
            biblia-septuaginta-griega-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
